<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trench Line 2</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#eadfc4;--gold:#d8b75a}

</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="bar"></div>
<div id="ov"><h1>Trench Line 2</h1><p>A huge, deep battlefield. Spawn riflemen, assault troops, snipers, tanks and missile trucks and push right to destroy the enemy bunker.</p><p>Drag to look around. Scroll or pinch to zoom. Tap the minimap to jump. Keys 1–9 and 0 spawn units, A/D scroll. Turn your sound on.</p><button id="go">Start battle</button><button id="sbx" style="margin-top:10px;font:inherit;font-size:16px;padding:10px 22px;background:#7b6e4c;color:#fff;border:0;border-radius:4px;cursor:pointer">Sandbox mode</button></div>
<script>
const WL=6000,K=WL/6000,WH=560,TOP=110,DK=(WH-336)/60,LIP=300,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const T={
 rifle:{n:'Rifleman',c:20,hp:50,d:9,r:1300,cd:.95,sp:85,k:'gun'},
 assault:{n:'Assault',c:35,hp:80,d:5,r:950,cd:.16,sp:100,k:'gun'},
 mechanic:{n:'Mechanic',c:75,hp:65,d:7,r:1000,cd:.55,sp:85,k:'mech'},
 sniper:{n:'Sniper',c:100,hp:35,d:55,r:1800,cd:2.6,sp:70,k:'gun'},
 medic:{n:'Medic',c:100,hp:55,d:6,r:800,cd:.8,sp:90,k:'medic'},
 mortar:{n:'Mortar',c:150,hp:70,d:75,r:2600,cd:4.2,sp:40,k:'mortar',sr:80},
 hmortar:{n:'Heavy mortar',c:200,hp:150,d:130,r:3600,cd:6,sp:32,k:'mortar',sr:130},
 tank:{n:'Tank',c:250,hp:360,d:50,r:2400,cd:2.4,sp:60,k:'shell',sr:70},
 truck:{n:'Missile truck',c:300,hp:200,d:160,r:4200,cd:3.8,sp:50,k:'missile',sr:150},
 heavy:{n:'Heavy tank',c:450,hp:760,d:85,r:2900,cd:3,sp:45,k:'shell',sr:105}
};

const keys=Object.keys(T),H={medic:56,heavy:82,rifle:56,assault:56,sniper:52,sandbag:42,tank:62,truck:72,mortar:60,mechanic:56,hmortar:70};
let g=null,last=0,cam={x:0,z:1},AC,nb,mute=false,dpr=1;
/* ---------- audio ---------- */
function aud(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state==='suspended')AC.resume()}
function nz(dur,f0,f1,vol,type,q){const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),G=AC.createGain();s.buffer=nb;s.loop=true;f.type=type||'lowpass';f.Q.value=q||1;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);G.gain.setValueAtTime(vol,t);G.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(G);G.connect(AC.destination);s.start(t,Math.random()*.5);s.stop(t+dur)}
function tone(f0,f1,dur,vol,type){const t=AC.currentTime,o=AC.createOscillator(),G=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);G.gain.setValueAtTime(vol,t);G.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(G);G.connect(AC.destination);o.start(t);o.stop(t+dur)}
function whoosh(v){const t=AC.currentTime,mk=(type,f0,f1,q,peak,pk,dur)=>{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),G=AC.createGain();s.buffer=nb;s.loop=true;f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);G.gain.setValueAtTime(.0001,t);G.gain.exponentialRampToValueAtTime(peak,t+pk);G.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(G);G.connect(AC.destination);s.start(t,Math.random()*.5);s.stop(t+dur+.05)};
 mk('bandpass',300,4800,.9,.9*v,.16,1.9);mk('highpass',2500,7000,.7,.35*v,.3,1.5);mk('lowpass',700,90,.8,.5*v,.08,1.4)}
function snd(k,x){
 if(mute||!AC||g.sn>7)return;g.sn++;
 const v=Math.max(.12,1-Math.abs(x-(cam.x+vw()/2))/2400);
 if(k==='rifle'){nz(.05,6000,2500,.5*v,'highpass');nz(.22,3200,300,.5*v);tone(150,50,.1,.3*v);setTimeout(()=>{if(AC){nz(.5,900,100,.12*v);tone(3200,2200,.03,.05*v)}},90)}
 else if(k==='assault'){nz(.04,6500,3000,.3*v,'highpass');nz(.1,4200,500,.32*v);tone(130,60,.06,.18*v)}
 else if(k==='sniper'){nz(.06,8000,3000,.7*v,'highpass');nz(.6,5000,120,.8*v,'lowpass',1.5);tone(110,35,.45,.55*v);setTimeout(()=>{if(AC)nz(1.2,1200,60,.3*v)},220);setTimeout(()=>{if(AC){tone(1200,500,.03,.08*v);setTimeout(()=>tone(700,300,.04,.08*v),160)}},800)}
 else if(k==='tank'){tone(90,28,.5,.8*v,'sawtooth');nz(.6,1600,80,.8*v)}
 else if(k==='missile'){nz(.05,6000,1500,.4*v,'highpass');tone(170,45,.22,.4*v,'sawtooth');whoosh(v)}
 else if(k==='boom'){nz(1.1,900,40,v);tone(70,24,.9,.8*v)}
 else if(k==='step')nz(.06,900,300,.05*v,'lowpass');else if(k==='spawn')tone(520,820,.09,.12,'square');
 else if(k==='far')nz(1.6,300,35,.18,'lowpass');
}
function voc(f0,f1,dur,vol,fm,gr){const t=AC.currentTime,G=AC.createGain(),o=AC.createOscillator(),o2=AC.createOscillator(),vib=AC.createOscillator(),vg=AC.createGain(),mix=AC.createGain();o.type='sawtooth';o2.type='square';[o,o2].forEach((q,i)=>{const f=i?1.012:1;q.frequency.setValueAtTime(f0*f,t);q.frequency.linearRampToValueAtTime(f1*f,t+dur*.35);q.frequency.linearRampToValueAtTime(f0*f*.75,t+dur)});vib.frequency.value=gr?4:7+Math.random()*2;vg.gain.value=f0*.035;vib.connect(vg);vg.connect(o.frequency);vg.connect(o2.frequency);mix.gain.value=.5;o.connect(mix);o2.connect(mix);
 fm.forEach((f,i)=>{const b=AC.createBiquadFilter(),q=AC.createGain();b.type='bandpass';b.frequency.value=f;b.Q.value=4+i*2;q.gain.value=i?.7:1.2;mix.connect(b);b.connect(q);q.connect(G)});
 G.gain.setValueAtTime(.0001,t);G.gain.exponentialRampToValueAtTime(vol*2,t+.06);G.gain.setValueAtTime(vol*2,t+dur*.55);G.gain.exponentialRampToValueAtTime(.001,t+dur);G.connect(AC.destination);[o,o2,vib].forEach(q=>{q.start(t);q.stop(t+dur+.05)});nz(dur,2600,1400,vol*.18,'bandpass',1.5)}
function cry(k,x){return;if(mute||!AC||!g||g.sn>9)return;g.sn++;const v=Math.max(.15,1-Math.abs(x-(cam.x+vw()/2))/2400),r=.9+Math.random()*.25;
 if(k==='groan')voc(150*r,100*r,.9+Math.random()*.4,.5*v,[420,900],1);else if(k==='grunt')voc(190*r,130*r,.28,.45*v,[600,1100]);else if(k==='scream')voc(380*r,740*r,1+Math.random()*.4,.65*v,[850,1500]);else voc(280*r,460*r,.5,.55*v,[750,1300])}
function groan(u){if(!g||Math.abs(u.x-(cam.x+vw()/2))>vw()*.65)return;cry('groan',u.x)}
/* ---------- camera ---------- */
const sc=()=>cv.height/(WH-TOP)*cam.z,vw=()=>cv.width/sc();
function clampCam(){cam.z=Math.max(.6,Math.min(2.6,cam.z));const v=vw();cam.x=isFinite(v)&&isFinite(cam.x)?Math.max(0,Math.min(WL-v,cam.x)):0}
function resize(){dpr=Math.min(devicePixelRatio||1,2);cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;clampCam()}
addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);
const ptr=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{{const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,cw=r.width,mw=Math.min(360,cw-460),mx=(cw-mw)/2;if(mw>120&&py>=30&&py<=58&&px>=mx&&px<=mx+mw){cam.x=(px-mx)/mw*WL-vw()/2;clampCam();return}}cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);pd=0;cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{
 if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);
 if(ptr.size===1){cam.x-=(e.clientX-o[0])*dpr/sc()}
 else{const ids=[...ptr.keys()],o2=ptr.get(ids[0]===e.pointerId?ids[1]:ids[0]);const d0=Math.hypot(o[0]-o2[0],o[1]-o2[1]),d1=Math.hypot(e.clientX-o2[0],e.clientY-o2[1]);if(d0>0)zoomAt((e.clientX+o2[0])/2,d1/d0)}
 ptr.set(e.pointerId,[e.clientX,e.clientY]);clampCam()});
const up=e=>{ptr.delete(e.pointerId);cv.style.cursor='grab'};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function zoomAt(cx,f){const r=cv.getBoundingClientRect(),wx=cam.x+(cx-r.left)*dpr/sc();cam.z*=f;cam.z=Math.max(.6,Math.min(2.6,cam.z));cam.x=wx-(cx-r.left)*dpr/sc();clampCam()}
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.deltaY<0?1.12:.89)},{passive:false});
const held={};addEventListener('keydown',e=>{if(e.key==='Escape')menu();held[e.key.toLowerCase()]=1;const i=e.key==='0'?9:parseInt(e.key)-1;if(keys[i]&&btns[keys[i]])btns[keys[i]].click()});addEventListener('keyup',e=>held[e.key.toLowerCase()]=0);
/* ---------- ui ---------- */
const bar=document.getElementById('bar'),btns={};
keys.forEach((k,i)=>{const b=document.createElement('button');b.innerHTML=`${i+1}. ${T[k].n}<small>$${T[k].c}</small>`;b.onclick=()=>{aud();if(g&&!g.over&&g.money>=T[k].c&&spawn(k,g.sb?g.side:0,g.sb?cam.x+vw()/2+(Math.random()-.5)*160:undefined)){if(!g.sb)g.money-=T[k].c;snd('spawn',cam.x)}};bar.appendChild(b);btns[k]=b});
const mb=document.createElement('button');mb.innerHTML='Sound<small>on</small>';mb.onclick=()=>{mute=!mute;mb.querySelector('small').textContent=mute?'off':'on'};bar.appendChild(mb);
const rb=document.createElement('button');rb.innerHTML='View<small>reset</small>';rb.onclick=()=>{cam.z=1;cam.x=0;clampCam()};bar.appendChild(rb);
const sbb=document.createElement('button');sbb.innerHTML='Team<small>mine</small>';sbb.style.display='none';sbb.onclick=()=>{g.side=1-g.side;sbb.querySelector('small').textContent=g.side?'enemy':'mine'};bar.appendChild(sbb);
const clr=document.createElement('button');clr.innerHTML='Clear<small>field</small>';clr.style.display='none';clr.onclick=()=>{g.units=[];g.proj=[];g.dead=[]};bar.appendChild(clr);
const mn=document.createElement('button');mn.innerHTML='Menu<small>pause</small>';mn.onclick=menu;bar.appendChild(mn);
/* ---------- game ---------- */
function reset(){g={money:160,em:160,t:0,units:[],dead:[],proj:[],pt:[],tr:[],sc:[],bl:[],shake:0,sn:0,over:false,aiT:3,far:6,
 bases:[{x:130,y:430,hp:1500,max:1500,team:0,cd:0},{x:WL-130,y:430,hp:1500,max:1500,team:1,cd:0}]}}
function spawn(type,team,sx,sy){
 if(g.units.filter(u=>u.team===team).length>=50)return false;
 const dir=team?-1:1;let x=sx!==undefined?sx:team?WL-250:250;
 if(type==='sandbag'){let f=x;g.units.forEach(u=>{if(u.team===team&&u.t!=='sandbag')f=team?Math.min(f,u.x):Math.max(f,u.x)});x=Math.max(350,Math.min(WL-350,f+dir*100))}
 else x+=(Math.random()-.5)*14;
 const y=sy!==undefined?sy:type==='sandbag'?372+Math.random()*(WH-372-110):350+Math.random()*(WH-350-110);
 g.units.push({t:type,team,x,y,hp:T[type].hp,max:T[type].hp,cd:.4,fl:0,ph:Math.random()*6,mv:false,seed:Math.random()*9,aim:0,el:0,pe:0,cv:false,gt:3,th:0,v:0,mm:[1,1],b:g.t});
 return true;
}
function puff(x,y,n,k,s){for(let i=0;i<n;i++)g.pt.push({x,y,vx:(Math.random()-.5)*(k==='spark'||k==='dirt'?260:40),vy:-Math.random()*(k==='spark'||k==='dirt'?240:50),l:k==='cas'?1:k==='smoke'?1.5+Math.random()*2.5:1+Math.random(),m:k==='smoke'?4:1.5,s:s*(.5+Math.random()),k,gr:k==='smoke'?-20:k==='heal'?-60:500})}
function boom(x,y,r){g.pt.length<500&&(puff(x,y,10,'smoke',r*.35),puff(x,y,8,'smoke',r*.6),puff(x,y,12,'spark',2),puff(x,y-6,16,'dirt',3.5));g.fl=(g.fl||[]);g.fl.push({x,y,r,l:.4});g.shake=Math.min(14,g.shake+r*.12);g.sc.push({x,y:Math.max(Math.min(y,WH-90),350),r});if(g.sc.length>40)g.sc.shift();snd('boom',x)}
function stain(x,y,n,r){for(let i=0;i<n;i++)g.bl.push({x:x+(Math.random()-.5)*r*1.6,y:y+2+Math.random()*7,rx:r*(.4+Math.random()*.7),ry:r*(.12+Math.random()*.15),a:.55+Math.random()*.3});if(g.bl.length>160)g.bl.splice(0,g.bl.length-160)}
function hurt(o,a,team){
 if(o.dead||o.down>0)return;if(o.cv&&Math.random()<.5){puff(o.x,o.y-30,2,'spark',1.5);return}o.hp-=a;
 if(o.hp>0&&o.t&&(T[o.t].k==='gun'||T[o.t].k==='medic'||T[o.t].k==='mech')){puff(o.x,o.y-30,5,'blood',1);stain(o.x-(Math.random()-.5)*10,o.y+1,1,5);if(a>=30&&Math.random()<.5)cry('scream',o.x);else if(Math.random()<.12)cry('grunt',o.x)}
 if(o.hp<=0){if(o.t&&(T[o.t].k==='gun'||T[o.t].k==='mech')&&!o.dd&&Math.random()<.8){o.dd=1;o.down=26;puff(o.x,o.y-28,14,'blood',1.6);stain(o.x,o.y,3,11);o.hp=1;o.mv=false;o.cv=false;cry('scream',o.x);say(o,'Man down!');return}o.dead=true;if(o.t){if((T[o.t].k==='gun'||T[o.t].k==='medic'||T[o.t].k==='mech')&&Math.random()<.6)cry('scream',o.x);if(T[o.t].k==='gun'||T[o.t].k==='medic'||T[o.t].k==='mech'){puff(o.x,o.y-26,22,'blood',2);stain(o.x,o.y,5,16)}if(team===0){const r=40+Math.floor(Math.random()*21);g.money+=r;(g.sy=g.sy||[]).push({x:o.x,y:o.y-60,t:1.3,txt:'+$'+r,team:0})}else g.em+=T[o.t].c*.35;g.dead.push({...o,age:0});if(T[o.t].k==='shell'||T[o.t].k==='missile')boom(o.x,o.y-20,50)}}
}
function splash(x,y,rad,dmg,team){
 boom(x,y,rad);
 g.units.forEach(e=>{if(e.team===team||e.dead)return;const d=Math.hypot(e.x-x,(e.y-y)*1.4);if(d<rad)hurt(e,dmg*(1-d/(rad*1.3)),team)});
 const b=g.bases[1-team];if(Math.abs(b.x-x)<rad+60)hurt(b,dmg*.8,team);
}
function target(u){
 const dir=u.team?-1:1,sp=T[u.t],r=sp.r;let best=null,bs=1e9,bdx=1e9;
 g.units.forEach(e=>{if(e.team===u.team||e.dead||(e.down>0&&Math.abs(e.x-u.x)>230))return;const dx=(e.x-u.x)*dir;if(dx<=-8||dx>r)return;
  let sc=dx;const low=1-Math.max(0,e.hp)/e.max,ek=T[e.t].k;
  if(e.down>0)sc+=500;
  if(sp.k==='gun'||sp.k==='mech'){sc-=low*220;
   if(u.t==='sniper')sc-=({medic:900,sniper:700,mortar:650,truck:600,assault:250,rifle:200}[e.t]||0);
   else if(ek==='shell'||ek==='missile')sc+=150}
  else if(sp.k==='shell')sc-=({heavy:520,tank:500,truck:450,mortar:420,sniper:200,medic:150}[e.t]||0);
  else if(sp.k==='missile')sc-=({heavy:900,tank:800,truck:500,mortar:450,sniper:200}[e.t]||0);
  else if(sp.k==='mortar'){let c=0;g.units.forEach(o=>{if(o.team!==u.team&&!o.dead&&Math.abs(o.x-e.x)<90&&Math.abs(o.y-e.y)<60)c++});sc-=c*220}
  if(sc<bs){bs=sc;best=e;bdx=dx}});
 const b=g.bases[1-u.team],dx=(b.x-u.x)*dir;if(dx<=r+60&&(!best||dx<bdx))best=b;
 return best;
}
function fire(u,tg){
 if(T[u.t].k==='missile'&&((u.rl||0)<.98||!(u.mm[0]||u.mm[1]))){u.cd=.15;return}
 if(T[u.t].k==='mortar'){if((u.dp||0)<1||!u.ld){u.cd=.2;return}u.ms=.0001;u.mx=tg.x;u.my=tg.t?tg.y:tg.y+10;return}
 const s=T[u.t],dir=u.team?-1:1;u.fl=.12;u.aim=(tg.y-u.y)*.0;
 if(s.k==='gun'||s.k==='medic'||s.k==='mech'){
  const mx=u.x+dir*(u.t==='sniper'?52:40),my=u.y-(u.t==='sniper'&&!u.mv?18:30);
  g.tr.push({a:mx,b:my,c:tg.x+(Math.random()-.5)*10,d:tg.t?tg.y-26:tg.y-60,l:.07,w:u.t==='sniper'?2.2:1.2});
  g.pt.push({x:u.x,y:u.y-30,vx:-dir*(30+Math.random()*50),vy:-90-Math.random()*60,l:1,m:1.5,s:2,k:'cas',gr:500});puff(mx,my,u.t==='sniper'?5:2,'smoke',u.t==='sniper'?8:4);puff(mx,my,3,'spark',1);puff(tg.x,tg.t?tg.y-24:tg.y-60,3,'spark',1.5);puff(tg.x,tg.t?tg.y-10:tg.y-40,1,'smoke',5);
  if(tg.down>0){tg.down=0;tg.hp=-1;puff(tg.x,tg.y-14,12,'blood',1.4);stain(tg.x-(tg.team?-1:1)*30,tg.y,5,15);hurt(tg,1,u.team)}else if(Math.random()<Math.max(.25,1.05-Math.abs(tg.x-u.x)/s.r*.8))hurt(tg,s.d,u.team);snd(u.t==='mechanic'?'assault':u.t,u.x);
 }else{
